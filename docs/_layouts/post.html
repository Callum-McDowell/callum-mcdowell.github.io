---
layout: default
---

{% include header.html %}

<main>
    <h1>{{ page.title }}</h1>
    <p class="note">Published on {{ page.date | date: "%-d %B %Y" }}</p>

    {% if page.tags != empty %}
    <p class="note">Tags: <em>{{ page.tags | join: "</em> - <em>" }}</em></p>
    {% endif %}

    {{ content }}
</main>
