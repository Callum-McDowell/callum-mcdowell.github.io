layout: default
---

{% include header.html %}

<main>
    <h1>{{ page.title }}</h1>
    <p class="note">Published on {{ page.date | date_to_long_string: "ordinal" }}</p>

    {% if page.tags != empty %}
    <p class="note">Tags: <em>{{ page.tags | array_to_sentence_string }}</em></p>
    {% endif %}

    {{ content }}
</main>
