<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="icon" href="{{ site.logo | relative_url }}" type="image/svg+xml" />

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="stylesheet" href="{{'/assets/css/rouge-style-github-light.css' | relative_url }}"
        media="(prefers-color-scheme: light), (prefers-color-scheme: no-preference)">
    <link rel="stylesheet" href="{{'/assets/css/rouge-style-github-dark.css' | relative_url }}"
        media="(prefers-color-scheme: dark)">

    <title>{{ page.title }}</title>
    <meta name="description" content="{{ page.description }}">

    <!-- SEO: -->
    <meta property="og:locale" content="en-US">
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:site_name" content="{{ site.title }}">
    <meta property="og:title" content="{{ page.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    {% if page.header_image %}
    <meta property="og:image" content="{{ page.header_image | absolute_url }}">
    {% else %}
    <meta property="og:image" content="{{ site.logo | absolute_url }}">
    {% endif %}
</head>

<body>
    {{ content }}
</body>

</html>
