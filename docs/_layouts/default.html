<!DOCTYPE html>
<html lang="{{ site.lang | default: " en-US" }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="icon" href="{{ site.logo }}" type="image/x-icon" />

    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/rouge-style-github-light.css"
        media="(prefers-color-scheme: light), (prefers-color-scheme: no-preference)">
    <link rel="stylesheet" href="/assets/css/rouge-style-github-dark.css" media="(prefers-color-scheme: dark)">

    <title>{{ page.title }}</title>
    <meta name="description" content="{{ page.description }}">

    <!-- SEO: -->
    <meta name="og:locale" content="en_US">
    <meta name="og:type" content="article">
    <meta name="og:url" content="{{ absolute_url }}">
    <meta name="og:site_name" content="{{ site.title }}">
    <meta name="og:title" content="{{ page.title }}">
    <meta name="og:description" content="{{ page.description }}">
    {% if page.header_image %}
    <meta name="og:image" content="{{ page.header_image }}">
    {% else %}
    <meta name="og:image" content="{{ site.logo }}">
    {% endif %}
</head>

<body>
    <header>
        <p><a href="{{ '/' | absolute_url }}">« {{ site.title }}</a></p>
    </header>
    <main>
        {{ content }}
    </main>
    <footer>
        <p class="note"><em>{{ site.description }}</em></p>
    </footer>
</body>

</html>
