<!DOCTYPE html>
<html lang="{{ site.lang | default: " en-US" }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="/assets/css/style.css">

    <link rel="stylesheet" href="/assets/css/rouge-style-github-light.css"
        media="(prefers-color-scheme: light), (prefers-color-scheme: no-preference)">
    <link rel="stylesheet" href="/assets/css/rouge-style-github-dark.css" media="(prefers-color-scheme: dark)">

    <title>{{ page.title }}</title>
    <!-- TODO: add SEO stuff like meta tags? -->
</head>

<body>
    <header>
        <p><a href="{{ '/' | absolute_url }}">« {{ site.title }}</a></p>
        {% if site.logo %}
        <img src="{{ site.logo }}" alt="Logo" />
        {% endif %}
    </header>
    <main>
        {{ content }}
    </main>
    <footer>
        <p class="note"><em>{{ site.description }}</em></p>
    </footer>
</body>

</html>
